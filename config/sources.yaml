sources:
  - name: X AI Watchlist
    type: aggregator
    url: https://api.x.com/2/tweets/search/recent
    mode: x_recent_search
    query: '(AI OR Claude OR OpenAI OR Anthropic OR Gemini OR agent) lang:en -is:retweet'
    token_env: X_BEARER_TOKEN
    priority: medium
    max_items: 5
    enabled: false
    notes: Temporarily disabled; X API recent search is deferred and should not participate in daily runs for now.

  - name: Anthropic News
    type: official
    url: https://www.anthropic.com/news
    mode: webpage
    article_path_prefix: /news/
    priority: high
    max_items: 3
    enabled: true
    notes: Anthropic official news page.

  - name: OpenAI News
    type: official
    url: https://openai.com/news/rss.xml
    mode: rss
    priority: high
    max_items: 3
    enabled: true
    notes: OpenAI official news feed.

  - name: Google DeepMind Blog
    type: official
    url: https://deepmind.google/discover/blog/
    mode: webpage
    article_path_prefix: /blog/
    priority: high
    max_items: 3
    enabled: true
    notes: Google DeepMind official blog page.

  - name: Meta AI Blog
    type: official
    url: https://ai.meta.com/blog/
