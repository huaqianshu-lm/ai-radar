name: Remote news fetch

on:
  schedule:
    # 23:00 UTC = 07:00 Asia/Shanghai on the next calendar day. GitHub may delay scheduled runs during load.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-radar-remote-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Set run date
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch raw news
        run: python scripts/fetch_sources.py --date "${{ steps.date.outputs.date }}"

      - name: Validate remote raw
        if: always()
        run: |
          raw_dir="data/raw/${{ steps.date.outputs.date }}"
          raw_count="$(find "$raw_dir" -type f -name '*.md' 2>/dev/null | wc -l | tr -d ' ')"

          if [ "$raw_count" -eq 0 ]; then
            echo "No raw files were produced; inspect the fetch log and source failures."
            exit 1
          fi

          echo "Remote raw files: $raw_count"

      - name: Publish raw for local sync
        if: success()
        env:
          RUN_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail

          sync_branch="remote-news"
          sync_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$sync_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if git ls-remote --exit-code --heads origin "$sync_branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$sync_branch:refs/remotes/origin/$sync_branch"
            git worktree add --detach "$sync_dir" "origin/$sync_branch"
          else
            git worktree add --detach "$sync_dir" HEAD
          fi

          mkdir -p "$sync_dir/data/raw/$RUN_DATE"
          cp -R "data/raw/$RUN_DATE/." "$sync_dir/data/raw/$RUN_DATE/"

          git -C "$sync_dir" config user.name "github-actions[bot]"
          git -C "$sync_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$sync_dir" add -f "data/raw/$RUN_DATE"

          if git -C "$sync_dir" diff --cached --quiet; then
            echo "No new raw files to publish."
          else
            git -C "$sync_dir" commit -m "chore: publish remote raw $RUN_DATE"
            git -C "$sync_dir" push origin "HEAD:$sync_branch"
          fi

      - name: Upload raw backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-radar-raw-${{ steps.date.outputs.date }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/raw/${{ steps.date.outputs.date }}/
            logs/
