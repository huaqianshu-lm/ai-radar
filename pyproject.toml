[project]
name = "ai-radar"
version = "0.1.0"
description = "Personal AI intelligence radar v0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "lxml_html_clean>=0.4.0",
    "pyyaml>=6.0.0",
    "trafilatura>=1.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
package = false
